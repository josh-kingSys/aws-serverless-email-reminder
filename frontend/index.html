<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Reminder</title>
  <link rel="stylesheet" href="styles.css">
  <script src="welcome.js" defer></script>
</head>
<body>
  <main>
    <h1>Email Reminder</h1>

    <form id="registration-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="verify-button" type="submit">Verify email</button>
    </form>

    <button id="check-button" type="button">Check verification and continue</button>
    <p id="status" role="status" aria-live="polite"></p>

    <hr>
    <button id="josh-button" type="button">Send to Josh instead</button>
  </main>
</body>
</html>
